name: Delete obsolete prototype branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/delete-obsolete-prototype-branch.yml'

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete prototype branch if it exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: prototype/marp-japanese-typesetting
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/branch.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${BRANCH}")
          if [ "$status" = "404" ]; then
            echo "Branch already absent"
            exit 0
          fi
          if [ "$status" != "200" ]; then
            cat /tmp/branch.json
            exit 1
          fi
          curl --fail-with-body -sS -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${BRANCH}"
