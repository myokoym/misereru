name: Prototype render

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/marp-japanese-typesetting
    paths:
      - 'prototype/**'
      - 'themes/**'
      - 'marp*.config.mjs'
      - 'package.json'
      - '.github/workflows/prototype-render.yml'

concurrency:
  group: prototype-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Render baseline and tuned outputs
        run: npm run build:prototype

      - name: Upload render artifacts
        uses: actions/upload-artifact@v7
        with:
          name: marp-japanese-typesetting
          path: dist/
          if-no-files-found: error
